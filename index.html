<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>CS立体図 + 地理院地図</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { margin:0; height:100%; }
    #map { width:100%; height:100%; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  const map = L.map('map').setView([36.0, 138.0], 11);

  // 地理院地図（背景）
  L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
    { attribution: '© 地理院' }
  ).addTo(map);

  // CS立体図（重ね）
  const csLayer = L.tileLayer(
    'https://tile.geospatial.jp/CS/VER2/{z}/{x}/{y}.png',
    {
      opacity: 0.7,
      minZoom: 10,
      maxZoom: 18,
      attribution: '© 長野県 CS立体図'
    }
  ).addTo(map);

</script>

</body>
</html>
