<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Leaflet 初期状態</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100vw; }
    .leaflet-control button {
      background:white; border:1px solid #ccc; border-radius:6px;
      padding:6px 10px; cursor:pointer;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 1) map
  const map = L.map('map').setView([35.0, 138.0], 14);

  // 2) 地理院地図
  L.tileLayer(
    'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
    { attribution: '© 地理院' }
  ).addTo(map);

  // 3) 現在地ボタン
  const gpsBtn = L.control({ position: 'topleft' });
  gpsBtn.onAdd = function() {
    const btn = L.DomUtil.create('button', '');
    btn.textContent = '📍 現在地';
    L.DomEvent.on(btn, 'click', (e) => {
      L.DomEvent.stopPropagation(e);
      map.locate({ setView: true, maxZoom: 17, enableHighAccuracy: true });
    });
    return btn;
  };
  gpsBtn.addTo(map);

  let me;
  map.on('locationfound', (e) => {
    if (me) map.removeLayer(me);
    me = L.circleMarker(e.latlng, { radius: 8 });
    me.addTo(map).bindPopup('現在地').openPopup();
  });

  // 4) 共有URL
  const shareBtn = L.control({ position: 'topleft' });
  shareBtn.onAdd = function() {
    const btn = L.DomUtil.create('button', '');
    btn.textContent = '🔗 共有';
    btn.style.marginTop = '6px';
    L.DomEvent.on(btn, 'click', async (e) => {
      L.DomEvent.stopPropagation(e);
      const c = map.getCenter();
      const z = map.getZoom();
      const url = `${location.origin}${location.pathname}?lat=${c.lat.toFixed(6)}&lng=${c.lng.toFixed(6)}&z=${z}`;
      try {
        await navigator.clipboard.writeText(url);
        alert('共有URLをコピーしました');
      } catch {
        prompt('コピーできない場合はこのURLをコピーしてください', url);
      }
    });
    return btn;
  };
  shareBtn.addTo(map);

  // 5) URL復元
  const p = new URLSearchParams(location.search);
  if (p.has('lat') && p.has('lng') && p.has('z')) {
    map.setView(
      [parseFloat(p.get('lat')), parseFloat(p.get('lng'))],
      parseInt(p.get('z'), 10)
    );
  }
</script>

</body>
</html>
