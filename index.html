<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Leaflet Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet（CDN） -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  const map = L.map('map').setView([35.0, 138.0], 14);

  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    attribution: '© 地理院'
  }).addTo(map);

  // ===== 施業 → 色 =====
  function colorBySEGYO(segyo) {
    if (!segyo) return '#999999';

    if (segyo.includes('間伐')) return '#ff7f00'; // オレンジ
    if (segyo.includes('主伐')) return '#e41a1c'; // 赤
    if (segyo.includes('保育')) return '#4daf4a'; // 緑

    return '#999999';
  }

  // --- 現在地ボタン ---
  const gpsBtn = L.control({ position: 'topleft' });
  gpsBtn.onAdd = function() {
    const btn = L.DomUtil.create('button', '');
    btn.textContent = '📍 現在地';
    btn.style.padding = '8px 10px';
    btn.style.background = 'white';
    btn.style.border = '1px solid #ccc';
    btn.style.borderRadius = '6px';
    btn.style.cursor = 'pointer';

    L.DomEvent.on(btn, 'click', (e) => {
      L.DomEvent.stopPropagation(e);
      map.locate({ setView: true, maxZoom: 17, enableHighAccuracy: true });
    });
    return btn;
  };
  gpsBtn.addTo(map);

  let me;
  map.on('locationfound', (e) => {
    if (me) map.removeLayer(me);
    me = L.circleMarker(e.latlng, { radius: 8 });
    me.addTo(map).bindPopup('現在地').openPopup();
  });

  map.on('locationerror', (e) => {
    alert('現在地を取得できませんでした：' + e.message);
  });

  // --- 共有URL ---
  const shareBtn = L.control({ position: 'topleft' });
  shareBtn.onAdd = function() {
    const btn = L.DomUtil.create('button', '');
    btn.textContent = '🔗 共有';
    btn.style.marginTop = '6px';
    btn.style.padding = '8px 10px';
    btn.style.background = 'white';
    btn.style.border = '1px solid #ccc';
    btn.style.borderRadius = '6px';
    btn.style.cursor = 'pointer';

    L.DomEvent.on(btn, 'click', async (e) => {
      L.DomEvent.stopPropagation(e);
      const c = map.getCenter();
      const z = map.getZoom();
      const url = `${location.origin}${location.pathname}?lat=${c.lat.toFixed(6)}&lng=${c.lng.toFixed(6)}&z=${z}`;
      try {
        await navigator.clipboard.writeText(url);
        alert('共有URLをコピーしました');
      } catch {
        prompt('コピーできない場合はこのURLをコピーしてください', url);
      }
    });
    return btn;
  };
  shareBtn.addTo(map);

  // --- URL復元 ---
  const p = new URLSearchParams(location.search);
  if (p.has('lat') && p.has('lng') && p.has('z')) {
    map.setView(
      [parseFloat(p.get('lat')), parseFloat(p.get('lng'))],
      parseInt(p.get('z'), 10)
    );
  }

  // --- 施業別にON/OFFできるように表示 ---
fetch('data/result.geojson')
  .then(r => r.json())
  .then(data => {

    // 施業ごとのレイヤグループ
    const groups = {};   // { "間伐": L.layerGroup(), ... }
    const all = L.layerGroup(); // 全部まとめ（fitBounds用）

    // GeoJSONの各地物を1件ずつ処理
    data.features.forEach(f => {
      const segyo = (f.properties && f.properties.SEGYO) ? String(f.properties.SEGYO) : '（不明）';

      if (!groups[segyo]) groups[segyo] = L.layerGroup();

      // 1地物だけのGeoJSONとしてレイヤ化
      const one = L.geoJSON(f, {
        style: ff => ({
          color: colorBySEGYO(ff.properties.SEGYO),
          weight: 2,
          fillOpacity: 0.5
        }),
        onEachFeature: (ff, layer) => {
          layer.bindPopup(`
            <b>市町村</b>: ${ff.properties.CITY}<br>
            <b>林班</b>: ${ff.properties.RIN}<br>
            <b>小班</b>: ${ff.properties.SHO}<br>
            <b>施業</b>: ${ff.properties.SEGYO}<br>
            <b>面積</b>: ${Math.round(ff.properties.AREA_)} ㎡
          `);
        }
      });

      one.addTo(groups[segyo]);
      one.addTo(all);
    });

    // 初期表示：全部ON（必要なら一部だけONにもできる）
    Object.values(groups).forEach(g => g.addTo(map));

    // ON/OFFコントロール（右上）
    L.control.layers(null, groups, { collapsed: false }).addTo(map);

    // 全体範囲にズーム（地物がある時だけ）
    if (all.getLayers().length > 0) {
      map.fitBounds(all.getBounds());
    }
  });
        }
      }).addTo(map);

      map.fitBounds(layer.getBounds());
    });
</script>
