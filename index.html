<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>CS立体図 現場確認マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/proj4/dist/proj4.js"></script>
<script src="https://unpkg.com/georaster"></script>
<script src="https://unpkg.com/georaster-layer-for-leaflet/dist/georaster-layer-for-leaflet.min.js"></script>

<style>
html, body { height:100%; margin:0; }
#map { height:100vh; width:100vw; }

/* ===== Bottom Sheet ===== */
#bottomSheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 9999;
  background: rgba(255,255,255,0.97);
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.13);
  transform: translateY(calc(100% - 44px));
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  display: flex;
  flex-direction: column;
  max-height: 80vh;
  font-family: sans-serif;
}
#bottomSheet.open {
  transform: translateY(0);
}
#sheetHandle {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}
#sheetHandle::after {
  content: '';
  width: 40px; height: 4px;
  background: #d0d0d0;
  border-radius: 2px;
}
#sheetContent {
  overflow-y: auto;
  padding: 0 16px 40px;
  -webkit-overflow-scrolling: touch;
}

/* ===== セクション ===== */
.s-section { margin-bottom: 18px; }
.s-title {
  font-size: 11px;
  color: #aaa;
  letter-spacing: 0.5px;
  margin: 0 0 8px 2px;
}
.s-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

/* ===== ボタン ===== */
.s-btn {
  background: #f5f5f5;
  border: 1px solid #e8e8e8;
  border-radius: 14px;
  padding: 12px 4px 10px;
  cursor: pointer;
  text-align: center;
  font-size: 11px;
  line-height: 1.5;
  transition: background 0.12s, border-color 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.s-btn .ico { font-size: 24px; display: block; margin-bottom: 2px; }
.s-btn:active { background: #e5e5e5; }

.s-btn.on {
  background: #fff0f0;
  border-color: #ffaaaa;
  color: #cc0000;
}
.s-btn.hi {
  background: #eef4ff;
  border-color: #99bbff;
  color: #0044cc;
}

/* CS透過度スライダー */
.s-slider-row {
  margin-top: 10px;
  display: none;
}
.s-slider-row input { width: 100%; }

/* ===== 記録中インジケーター ===== */
#recBadge {
  position: fixed;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  background: rgba(200,0,0,0.85);
  color: white;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-family: sans-serif;
  z-index: 9998;
  display: none;
  pointer-events: none;
}

/* ===== キャッシュ進捗 ===== */
#cacheBar {
  position: fixed;
  top: 0; left: 0;
  height: 4px;
  background: #0066ff;
  z-index: 99999;
  display: none;
  width: 0%;
  transition: width 0.2s;
}

/* ===== トースト ===== */
#toast {
  position: fixed;
  left: 50%; bottom: 60px;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 12px;
  z-index: 10000;
  display: none;
  white-space: nowrap;
}
</style>
</head>

<body>
<div id="map"></div>
<div id="toast"></div>
<div id="cacheBar"></div>
<div id="recBadge">● REC</div>

<input id="geojsonInput" type="file" accept=".geojson,.json" style="display:none">
<input id="cameraInput"  type="file" accept="image/*" capture="environment" style="display:none">
<input id="geotiffInput" type="file" accept=".tif,.tiff,.geotiff" style="display:none">

<!-- ===== Bottom Sheet ===== -->
<div id="bottomSheet">
  <div id="sheetHandle"></div>
  <div id="sheetContent">

    <!-- 地図 -->
    <div class="s-section">
      <div class="s-title">地図</div>
      <div class="s-grid">
        <button class="s-btn" id="btnBG">
          <span class="ico">🗺️</span>背景切替
        </button>
        <button class="s-btn" id="btnFollow">
          <span class="ico">🧍</span>追従 ON
        </button>
        <button class="s-btn" id="btnShare">
          <span class="ico">🔗</span>共有
        </button>
      </div>
      <div class="s-slider-row" id="csSliderRow">
        <div class="s-title" style="margin-top:8px;">CS立体図 透過度</div>
        <input id="csOpacity" type="range" min="0" max="100" value="100">
      </div>
    </div>

    <!-- 撮影・記録 -->
    <div class="s-section">
      <div class="s-title">撮影・記録</div>
      <div class="s-grid">
        <button class="s-btn" id="btnCamera">
          <span class="ico">📷</span>カメラ
        </button>
        <button class="s-btn" id="btnRecord">
          <span class="ico">🔴</span>記録開始
        </button>
        <button class="s-btn" id="btnExportTrack" style="display:none">
          <span class="ico">⬇️</span>軌跡GPX
        </button>
        <button class="s-btn" id="btnClearTrack" style="display:none">
          <span class="ico">🗑️</span>軌跡クリア
        </button>
      </div>
    </div>

    <!-- GeoJSON -->
    <div class="s-section">
      <div class="s-title">GeoJSON</div>
      <div class="s-grid">
        <button class="s-btn" id="btnPickGeojson">
          <span class="ico">📂</span>選択
        </button>
        <button class="s-btn" id="btnJumpGeojson">
          <span class="ico">🎯</span>ジャンプ
        </button>
        <button class="s-btn" id="btnClearGeojson">
          <span class="ico">🗑️</span>クリア
        </button>
      </div>
    </div>

    <!-- GeoTIFF -->
    <div class="s-section">
      <div class="s-title">GeoTIFF・オフライン</div>
      <div class="s-grid">
        <button class="s-btn" id="btnPickGeotiff">
          <span class="ico">🛰️</span>GeoTIFF読込
        </button>
        <button class="s-btn" id="btnClearGeotiff" style="display:none">
          <span class="ico">🗑️</span>GTiffクリア
        </button>
        <button class="s-btn hi" id="btnCacheArea" style="display:none">
          <span class="ico">💾</span>タイル保存
        </button>
        <button class="s-btn" id="btnClearCache">
          <span class="ico">🧹</span>Cache削除
        </button>
      </div>
    </div>

  </div>
</div>

<script>
/* =========================
   Service Worker
========================= */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW:',e));
}

/* =========================
   util
========================= */
function toast(msg, ms=2000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.style.display='none', ms);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function propsToHtml(props){
  if(!props) return '属性なし';
  const keys=Object.keys(props); if(!keys.length) return '属性なし';
  return keys.slice(0,40).map(k=>`<div><b>${escapeHtml(k)}</b>: ${escapeHtml(props[k]==null?'':String(props[k]))}</div>`).join('');
}

/* =========================
   Bottom Sheet
========================= */
const sheet=document.getElementById('bottomSheet');
let sheetOpen=false;
function openSheet(){ sheetOpen=true; sheet.classList.add('open'); }
function closeSheet(){ sheetOpen=false; sheet.classList.remove('open'); }

document.getElementById('sheetHandle').addEventListener('click',()=>{ sheetOpen?closeSheet():openSheet(); });
document.getElementById('map').addEventListener('click',()=>{ if(sheetOpen) closeSheet(); });

/* =========================
   Map
========================= */
const map=L.map('map',{maxZoom:22}).setView([36.2,138.0],12);

const gsiStd=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
  {maxNativeZoom:18,maxZoom:22,attribution:'© 地理院'});
const gsiPhoto=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
  {maxNativeZoom:18,maxZoom:22,attribution:'© 地理院（航空写真）'});
const csLayer=L.tileLayer('https://tile.geospatial.jp/CS/VER2/{z}/{x}/{y}.png',
  {opacity:1.0,minZoom:8,maxNativeZoom:18,maxZoom:22,attribution:'© 長野県 CS立体図'});

let bgMode='cs';
const csSliderRow=document.getElementById('csSliderRow');
const csOpacity=document.getElementById('csOpacity');
csOpacity.addEventListener('input',()=>csLayer.setOpacity(csOpacity.value/100));

function applyBG(){
  map.removeLayer(gsiStd); map.removeLayer(gsiPhoto); map.removeLayer(csLayer);
  if(bgMode==='map'){ gsiStd.addTo(map); csSliderRow.style.display='none'; }
  if(bgMode==='photo'){ gsiPhoto.addTo(map); csSliderRow.style.display='none'; }
  if(bgMode==='cs'){ gsiStd.addTo(map); csLayer.addTo(map); csSliderRow.style.display=''; }
}
document.getElementById('btnBG').onclick=()=>{
  bgMode=bgMode==='cs'?'photo':bgMode==='photo'?'map':'cs';
  applyBG();
  toast(bgMode==='cs'?'背景：CS立体図':bgMode==='photo'?'背景：航空写真':'背景：地理院');
  closeSheet();
};
applyBG();

/* =========================
   Location + Follow
========================= */
let follow=true, me=null;
if(navigator.geolocation){
  navigator.geolocation.watchPosition(
    pos=>{
      const ll=[pos.coords.latitude,pos.coords.longitude];
      if(!me){ me=L.circleMarker(ll,{radius:8,color:'#0066ff',fillColor:'#3399ff',fillOpacity:0.9}).addTo(map); }
      else { me.setLatLng(ll); }
      if(follow) map.setView(ll,Math.max(map.getZoom(),16),{animate:true});
      if(recording) addTrackPoint(pos.coords.latitude,pos.coords.longitude);
    },
    err=>toast('現在地エラー: '+err.message,2500),
    {enableHighAccuracy:true,maximumAge:1000,timeout:15000}
  );
} else { toast('位置情報に対応していません'); }

const btnFollow=document.getElementById('btnFollow');
btnFollow.onclick=()=>{
  follow=!follow;
  btnFollow.innerHTML=`<span class="ico">${follow?'🧍':'🚶'}</span>追従 ${follow?'ON':'OFF'}`;
  btnFollow.classList.toggle('on',!follow);
  toast(follow?'自分を中央 ON':'自分を中央 OFF');
  closeSheet();
};

/* =========================
   Share
========================= */
document.getElementById('btnShare').onclick=async()=>{
  const c=map.getCenter(), z=map.getZoom();
  const url=`${location.origin}${location.pathname}?lat=${c.lat.toFixed(6)}&lng=${c.lng.toFixed(6)}&z=${z}`;
  try{ await navigator.clipboard.writeText(url); toast('URLをコピーしました'); }
  catch{ prompt('このURLをコピーしてください',url); }
  closeSheet();
};

/* =========================
   Camera
========================= */
const cameraInput=document.getElementById('cameraInput');
const photoLayer=L.layerGroup().addTo(map);
document.getElementById('btnCamera').onclick=()=>{ cameraInput.value=''; cameraInput.click(); closeSheet(); };
cameraInput.addEventListener('change',()=>{
  const file=cameraInput.files&&cameraInput.files[0]; if(!file) return;
  if(!me){ toast('現在地が未取得です',2500); return; }
  const ll=me.getLatLng(), imgURL=URL.createObjectURL(file);
  const ts=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  const fn=`photo_${ll.lat.toFixed(6)}_${ll.lng.toFixed(6)}_${ts}.jpg`;
  L.marker(ll).addTo(photoLayer).bindPopup(`
    <div style="text-align:center">
      <img src="${imgURL}" style="max-width:220px;border-radius:8px;"><br>
      <div style="font-size:12px;margin-top:4px;">${ll.lat.toFixed(6)}, ${ll.lng.toFixed(6)}</div>
      <a href="${imgURL}" download="${fn}" style="display:inline-block;margin-top:6px;padding:5px 12px;background:#0066ff;color:white;border-radius:8px;font-size:12px;text-decoration:none;">💾 写真を保存</a>
    </div>`).openPopup();
  map.setView(ll,Math.max(map.getZoom(),16));
  toast('写真ピンを追加（ポップアップから保存）',2500);
});

/* =========================
   軌跡記録
========================= */
let recording=false, trackPoints=[], trackLine=null;
const recBadge=document.getElementById('recBadge');

function updateTrackUI(){
  const has=trackPoints.length>0;
  const btn=document.getElementById('btnRecord');
  if(recording){
    btn.innerHTML='<span class="ico">⏹️</span>記録停止';
    btn.classList.add('on');
    recBadge.style.display='block';
  } else {
    btn.innerHTML='<span class="ico">🔴</span>記録開始';
    btn.classList.remove('on');
    recBadge.style.display='none';
  }
  document.getElementById('btnExportTrack').style.display=has?'':'none';
  document.getElementById('btnClearTrack').style.display=has?'':'none';
}

function addTrackPoint(lat,lng){
  trackPoints.push({lat,lng,time:new Date().toISOString()});
  const ll=trackPoints.map(p=>[p.lat,p.lng]);
  if(!trackLine){ trackLine=L.polyline(ll,{color:'#ff6600',weight:4,opacity:0.85}).addTo(map); }
  else { trackLine.setLatLngs(ll); }
}

document.getElementById('btnRecord').onclick=()=>{
  recording=!recording;
  toast(recording?'軌跡記録を開始しました':'軌跡記録を停止しました',2000);
  updateTrackUI(); closeSheet();
};
document.getElementById('btnExportTrack').onclick=()=>{
  if(!trackPoints.length){ toast('軌跡データがありません'); return; }
  const pts=trackPoints.map(p=>`    <trkpt lat="${p.lat}" lon="${p.lng}"><time>${p.time}</time></trkpt>`).join('\n');
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="CS立体図マップ" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>Track ${new Date().toLocaleString('ja-JP')}</name><trkseg>
${pts}
  </trkseg></trk>
</gpx>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'}));
  a.download=`track_${new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}.gpx`;
  a.click();
  toast('GPXをダウンロードしました',2000); closeSheet();
};
document.getElementById('btnClearTrack').onclick=()=>{
  trackPoints=[];
  if(trackLine){ map.removeLayer(trackLine); trackLine=null; }
  updateTrackUI(); toast('軌跡をクリアしました'); closeSheet();
};
updateTrackUI();

/* =========================
   GeoJSON
========================= */
const geojsonInput=document.getElementById('geojsonInput');
const gjGroup=L.featureGroup().addTo(map);

document.getElementById('btnPickGeojson').onclick=()=>{ geojsonInput.value=''; geojsonInput.click(); closeSheet(); };
document.getElementById('btnJumpGeojson').onclick=()=>{
  if(!gjGroup.getLayers().length){ toast('GeoJSONなし'); return; }
  map.fitBounds(gjGroup.getBounds().pad(0.15)); closeSheet();
};
document.getElementById('btnClearGeojson').onclick=()=>{
  gjGroup.clearLayers(); map.closePopup(); toast('GeoJSON クリア'); closeSheet();
};
geojsonInput.onchange=()=>{
  const f=geojsonInput.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const layer=L.geoJSON(JSON.parse(r.result),{
        style:()=>({color:'#ff0066',weight:2,fillOpacity:0.2}),
        onEachFeature:(ft,l)=>l.on('click',e=>{
          L.popup({maxWidth:360,autoPan:true}).setLatLng(e.latlng).setContent(propsToHtml(ft.properties)).openOn(map);
        })
      });
      gjGroup.addLayer(layer);
      map.fitBounds(gjGroup.getBounds().pad(0.15));
      toast('GeoJSON 読み込み完了');
    } catch{ toast('GeoJSONの読み込みに失敗しました'); }
  };
  r.readAsText(f);
};

/* =========================
   GeoTIFF
========================= */
const geotiffInput=document.getElementById('geotiffInput');
let geotiffLayer=null, geotiffBounds=null;

document.getElementById('btnPickGeotiff').onclick=()=>{ geotiffInput.value=''; geotiffInput.click(); closeSheet(); };
geotiffInput.addEventListener('change',async()=>{
  const file=geotiffInput.files[0]; if(!file) return;
  toast('GeoTIFF 読み込み中...',15000);
  try{
    const georaster=await parseGeoraster(await file.arrayBuffer());
    if(geotiffLayer) map.removeLayer(geotiffLayer);
    geotiffLayer=new GeoRasterLayer({georaster,opacity:0.75,resolution:256});
    geotiffLayer.addTo(map);
    geotiffBounds=geotiffLayer.getBounds();
    map.fitBounds(geotiffBounds);
    toast(`GeoTIFF 表示完了（${file.name}）`,3000);
  } catch(e){
    toast('GeoTIFF 読み込み失敗',3000); console.error(e);
  }
  updateGeotiffUI();
});
document.getElementById('btnClearGeotiff').onclick=()=>{
  if(geotiffLayer){ map.removeLayer(geotiffLayer); geotiffLayer=null; }
  geotiffBounds=null; updateGeotiffUI();
  toast('GeoTIFF クリア'); closeSheet();
};
function updateGeotiffUI(){
  const has=!!geotiffBounds;
  document.getElementById('btnClearGeotiff').style.display=has?'':'none';
  document.getElementById('btnCacheArea').style.display=has?'':'none';
}
updateGeotiffUI();

/* =========================
   タイルキャッシュ
========================= */
const TILE_CACHE='map-tiles-v1';
const CACHE_MIN_Z=10, CACHE_MAX_Z=17;
const TILE_TPLS=[
  'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
  'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
  'https://tile.geospatial.jp/CS/VER2/{z}/{x}/{y}.png',
];

function toTile(lat,lng,z){
  const n=1<<z;
  return {x:Math.floor((lng+180)/360*n), y:Math.floor((1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n)};
}
function tileCount(b){
  let n=0;
  for(let z=CACHE_MIN_Z;z<=CACHE_MAX_Z;z++){
    const sw=toTile(b.getSouth(),b.getWest(),z), ne=toTile(b.getNorth(),b.getEast(),z);
    n+=(ne.x-sw.x+1)*(sw.y-ne.y+1);
  }
  return n*TILE_TPLS.length;
}
function* tileUrls(b){
  for(let z=CACHE_MIN_Z;z<=CACHE_MAX_Z;z++){
    const sw=toTile(b.getSouth(),b.getWest(),z), ne=toTile(b.getNorth(),b.getEast(),z);
    for(let x=sw.x;x<=ne.x;x++) for(let y=ne.y;y<=sw.y;y++) for(const t of TILE_TPLS)
      yield t.replace('{z}',z).replace('{x}',x).replace('{y}',y);
  }
}

document.getElementById('btnCacheArea').onclick=async()=>{
  if(!geotiffBounds){ toast('まずGeoTIFFを読み込んでください'); return; }
  if(!('caches' in window)){ toast('このブラウザはキャッシュAPIに非対応です'); return; }
  const total=tileCount(geotiffBounds);
  if(!confirm(`約${total}枚のタイルをキャッシュします\n（約${Math.round(total*35/1024)}MB想定）\n続行しますか？`)) return;
  closeSheet();
  const urls=[...tileUrls(geotiffBounds)];
  const cache=await caches.open(TILE_CACHE);
  const bar=document.getElementById('cacheBar');
  bar.style.display='block'; bar.style.width='0%';
  let done=0;
  for(let i=0;i<urls.length;i+=8){
    await Promise.all(urls.slice(i,i+8).map(u=>fetch(u,{mode:'cors'}).then(r=>{if(r.ok)cache.put(u,r);}).catch(()=>{})));
    done=Math.min(i+8,urls.length);
    bar.style.width=`${Math.round(done/urls.length*100)}%`;
    if(done%100===0||done===urls.length) toast(`キャッシュ中 ${done}/${urls.length}`,2000);
  }
  bar.style.display='none';
  toast(`キャッシュ完了（${total}枚）オフラインで使用できます`,4000);
};
document.getElementById('btnClearCache').onclick=async()=>{
  if(!('caches' in window)) return;
  if(!confirm('タイルキャッシュをすべて削除しますか？')) return;
  await caches.delete(TILE_CACHE);
  toast('タイルキャッシュをクリアしました'); closeSheet();
};
</script>
</body>
</html>
