<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>現場確認マップ（カメラ最小版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { height:100%; margin:0; }
#map { height:100vh; width:100vw; }

/* 左下UI */
.ui-left{
  position: fixed;
  left: 10px;
  bottom: 10px;
  z-index: 9999;
  background: rgba(255,255,255,0.9);
  border: 1px solid #ccc;
  border-radius: 12px;
  padding: 8px;
  font-family: sans-serif;
}
.ui-left button{
  width: 100%;
  border: 1px solid #ccc;
  background: white;
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 6px;
}
.ui-left button:last-child{ margin-bottom:0; }
</style>
</head>

<body>
<div id="map"></div>

<!-- カメラ入力（非表示） -->
<input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none">

<!-- 左下メニュー -->
<div class="ui-left">
  <button id="btnLocate">🧍 現在地</button>
  <button id="btnCamera">📷 撮影</button>
</div>

<script>
/* =========================
   map
========================= */
const map = L.map('map').setView([36.2, 138.0], 12);

/* =========================
   base layer
========================= */
L.tileLayer(
  'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
  { attribution: '© 地理院' }
).addTo(map);

/* =========================
   現在地
========================= */
let meMarker = null;

function updateLocation(){
  if(!navigator.geolocation){
    alert('位置情報が使えません');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      if(!meMarker){
        meMarker = L.circleMarker([lat, lng], {
          radius: 8,
          color: '#0066ff',
          fillColor: '#3399ff',
          fillOpacity: 0.9
        }).addTo(map);
      }else{
        meMarker.setLatLng([lat, lng]);
      }

      map.setView([lat, lng], Math.max(map.getZoom(), 16));
    },
    err=>alert('現在地取得エラー: ' + err.message),
    { enableHighAccuracy:true, timeout:15000 }
  );
}

document.getElementById('btnLocate').onclick = updateLocation;

/* =========================
   カメラ → 写真ピン
========================= */
const cameraInput = document.getElementById('cameraInput');
const photoLayer = L.layerGroup().addTo(map);

document.getElementById('btnCamera').onclick = ()=>{
  cameraInput.value = '';
  cameraInput.click();
};

cameraInput.onchange = ()=>{
  const file = cameraInput.files[0];
  if(!file){
    return;
  }

  if(!navigator.geolocation){
    alert('位置情報が使えません');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      const imgURL = URL.createObjectURL(file);

      L.marker([lat, lng])
        .addTo(photoLayer)
        .bindPopup(`
          <div style="text-align:center">
            <img src="${imgURL}" style="max-width:220px; border-radius:8px;"><br>
            <div style="font-size:12px; margin-top:4px;">
              ${lat.toFixed(6)}, ${lng.toFixed(6)}
            </div>
          </div>
        `)
        .openPopup();

      map.setView([lat, lng], Math.max(map.getZoom(), 16));
    },
    err=>alert('位置情報取得エラー: ' + err.message),
    { enableHighAccuracy:true, timeout:15000 }
  );
};
</script>
</body>
</html>
